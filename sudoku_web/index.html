    <section class="panelR">
        <script>

            function createBoard(boardLocation) {
                document.getElementById(boardLocation).innerHTML = "";
                for(let i = 0; i < 9; i++) {
                    document.getElementById(boardLocation).innerHTML += '<tr class="boardRow" id="boardRow' + (i+1) + '"></tr>';
                }
                for(let i = 0; i < 9; i++) {
                    for(let j = 0; j < 9; j++) {
                        document.getElementsByClassName("boardRow")[i].innerHTML += '<td class="field" onclick="selectField(' + (j+1) + ',' + (i+1) + ')" class="field' + (j+1) + '"></td>'
                    }
                }
                console.log("Board Generated.");
            }

            let test;

            function selectField(x, y) {
              posX = x;
              posY = y;
              console.log("posX = ", posX);
              console.log("posY = ", posY);
            }
        </script>
        </script>
        <table class="board" onload="createBoard('mainBoard')">

        </table>
